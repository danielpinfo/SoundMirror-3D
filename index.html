<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TTS Tongue Visualizer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: white;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }
    canvas {
      display: block;
    }
    #playBtn {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<button id="playBtn">▶ Play</button>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js'

/* -------------------- SCENE -------------------- */

const scene = new THREE.Scene()

const camera = new THREE.PerspectiveCamera(
  40,
  window.innerWidth / window.innerHeight,
  0.01,
  10
)
camera.position.set(0, 0.08, 0.45)

const renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.setSize(window.innerWidth, window.innerHeight)
document.body.appendChild(renderer.domElement)

/* -------------------- LIGHTS -------------------- */

scene.add(new THREE.AmbientLight(0xffffff, 0.8))

const light = new THREE.DirectionalLight(0xffffff, 0.6)
light.position.set(0.3, 0.4, 0.5)
scene.add(light)

/* -------------------- TONGUE -------------------- */

const segments = 40
const geometry = new THREE.PlaneGeometry(0.18, 0.05, segments, 1)
geometry.rotateX(-Math.PI / 2)

const material = new THREE.MeshStandardMaterial({
  color: 0xcc6666,
  roughness: 0.45,
  metalness: 0.05,
  side: THREE.DoubleSide
})

const tongue = new THREE.Mesh(geometry, material)
tongue.position.y = -0.02
scene.add(tongue)

// Save rest pose
const basePositions = geometry.attributes.position.array.slice()

// Initial render so tongue is visible
renderer.render(scene, camera)

/* -------------------- AUDIO -------------------- */

const params = new URLSearchParams(window.location.search)
const audioPath = params.get('audio')

const audio = new Audio()
audio.src = audioPath || ''
audio.preload = 'auto'

let analyser = null
let freqData = null

/* -------------------- HELPERS -------------------- */

const clamp = (v, a, b) => Math.min(b, Math.max(a, v))
const map = (v, inA, inB, outA, outB) =>
  outA + (outB - outA) * ((v - inA) / (inB - inA))

function bandEnergy(freq, startHz, endHz, sampleRate) {
  const nyquist = sampleRate / 2
  const start = Math.floor(startHz / nyquist * freq.length)
  const end = Math.floor(endHz / nyquist * freq.length)
  let sum = 0
  for (let i = start; i < end; i++) sum += freq[i]
  return sum / (end - start)
}

/* -------------------- PLAY + ANIMATE -------------------- */

const playBtn = document.getElementById('playBtn')

playBtn.addEventListener('click', async () => {
  playBtn.remove()

  const ctx = new AudioContext()
  const source = ctx.createMediaElementSource(audio)

  analyser = ctx.createAnalyser()
  analyser.fftSize = 2048

  freqData = new Float32Array(analyser.frequencyBinCount)

  source.connect(analyser)
  analyser.connect(ctx.destination)

  await audio.play()

  animate()
})

function animate() {
  analyser.getFloatFrequencyData(freqData)

  const jaw  = bandEnergy(freqData, 80, 300, analyser.context.sampleRate)
  const body = bandEnergy(freqData, 500, 1500, analyser.context.sampleRate)
  const tip  = bandEnergy(freqData, 2000, 3500, analyser.context.sampleRate)

  const jawOpen  = clamp(map(jaw,  -70, -25, 0, 1), 0, 1)
  const bodyLift = clamp(map(body, -80, -30, 0, 1), 0, 1)
  const tipLift  = clamp(map(tip,  -85, -35, 0, 1), 0, 1)

  const pos = geometry.attributes.position.array

  for (let i = 0; i < pos.length; i += 3) {
    const x = basePositions[i]
    const t = (x + 0.09) / 0.18

    const lift =
      bodyLift * Math.sin(t * Math.PI) * 0.025 +
      tipLift * Math.pow(t, 3) * 0.02

    pos[i + 1] =
      basePositions[i + 1] + lift - jawOpen * 0.015
  }

  geometry.attributes.position.needsUpdate = true
  renderer.render(scene, camera)

  requestAnimationFrame(animate)
}

/* -------------------- RESIZE -------------------- */

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight
  camera.updateProjectionMatrix()
  renderer.setSize(window.innerWidth, window.innerHeight)
})
</script>

</body>
</html>
